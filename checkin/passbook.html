<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>明善寺福慧存摺</title>
<style>
  :root {
    --bg: #f6f2ea;
    --card: #fffdf8;
    --ink: #2f2a24;
    --muted: #8a8174;
    --green: #3d5a45;
    --green-soft: #e4ebe3;
    --gold: #b08d57;
    --gold-deep: #8f6c3c;
    --gold-soft: #f3e8d4;
    --tea: #d9c8ad;
    --line: #e7dfd1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(32px + env(safe-area-inset-bottom));
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  header .seal {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-deep); font-size: 14px; font-weight: 600;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: 0.12em; font-weight: 600; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 18px 16px; }
  svg { display: block; }

  /* 個人卡 */
  .me {
    display: flex; align-items: center; gap: 16px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 16px 18px;
  }
  .avatar {
    flex: none; width: 64px; height: 64px; border-radius: 50%;
    border: 2.5px solid #e9c97f; background: #fbf3e2; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar svg { width: 40px; height: 40px; }
  .me b { display: block; font-size: 18px; font-weight: 600; }
  .me .chip { margin-top: 6px; }
  .chip {
    display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 999px;
    letter-spacing: 0.08em; background: var(--gold-soft); color: var(--gold-deep);
  }
  .chip.hui { background: var(--green-soft); color: var(--green); }

  /* 蓮花等級卡 */
  .level {
    margin-top: 14px;
    border-radius: 20px;
    color: #fbf5ec;
    background: linear-gradient(140deg, #8c7262 0%, #6f5747 60%, #5e4a3d 100%);
    box-shadow: 0 14px 34px rgba(90, 65, 45, 0.22);
    overflow: hidden;
  }
  .level .head { display: flex; align-items: center; gap: 18px; padding: 22px 20px 6px; }
  .level .lotus {
    flex: none; width: 108px; height: 108px; border-radius: 50%;
    background: #fbf3e2; border: 4px solid #e9c97f;
    display: flex; align-items: center; justify-content: center;
  }
  .level .lotus svg { width: 72px; height: 72px; }
  .level small { font-size: 13px; opacity: 0.75; letter-spacing: 0.12em; }
  .level h2 { font-size: 24px; margin: 4px 0 6px; letter-spacing: 0.12em; font-weight: 600; }
  .level .desc { font-size: 13px; opacity: 0.85; letter-spacing: 0.05em; }
  .progress { padding: 14px 20px 18px; }
  .progress .row { display: flex; justify-content: space-between; font-size: 14px; }
  .progress .row span:first-child { font-weight: 600; letter-spacing: 0.06em; }
  .progress .row span:last-child { opacity: 0.8; }
  .bar { height: 9px; border-radius: 999px; background: rgba(255, 248, 235, 0.22); margin: 10px 0 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: #fbf5ec; transition: width 0.9s ease; }
  .progress .foot { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.75; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(0, 0, 0, 0.12); }
  .stats div { text-align: center; padding: 14px 4px 16px; }
  .stats div + div { border-left: 1px solid rgba(255, 248, 235, 0.12); }
  .stats b { display: block; font-size: 24px; font-weight: 600; }
  .stats span { display: block; font-size: 12px; opacity: 0.75; margin-top: 2px; letter-spacing: 0.08em; }

  /* 區塊 */
  .section { margin-top: 26px; }
  .section h3 { font-size: 15px; letter-spacing: 0.15em; color: var(--gold-deep); margin: 0 0 12px 4px; font-weight: 600; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-top: 1px solid var(--line); }
  .item:first-child { border-top: none; }
  .item .mid { flex: 1; min-width: 0; }
  .item .title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item .title b { font-size: 15px; font-weight: 600; }
  .item .sub { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.6; }
  .icon-box {
    flex: none; width: 44px; height: 44px; border-radius: 12px;
    background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .icon-box svg { width: 32px; height: 32px; }
  .empty { padding: 26px 16px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.8; }

  /* 等級系統 */
  .lv.now { background: #fbf6ec; }
  .lv.now .title b { color: var(--gold-deep); }
  .lv.locked .icon-box svg { filter: grayscale(1); opacity: 0.35; }
  .lv.locked .title b { color: var(--muted); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--gold); color: #fff; letter-spacing: 0.08em; }
  .state { flex: none; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .state.ok { background: var(--green-soft); color: var(--green); }
  .state.lock { background: #f0ebe2; color: #b5a993; }

  .dur { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .center { text-align: center; padding: 80px 24px; color: var(--muted); line-height: 1.9; }
  .center .spin {
    width: 52px; height: 52px; margin: 0 auto 20px; border-radius: 50%;
    border: 1.5px solid var(--tea); border-top-color: var(--green);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot-note { text-align: center; margin-top: 28px; font-size: 12px; color: var(--tea); letter-spacing: 0.2em; }
</style>
</head>
<body>
<header>
  <div class="seal">明</div>
  <h1>明善寺福慧存摺</h1>
</header>
<div class="wrap" id="app">
  <div class="center"><div class="spin"></div>翻開存摺中⋯</div>
</div>

<script src="/checkin/lotus.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const LIFF_ID = '__LIFF_ID__';
  const app = document.getElementById('app');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const CHECK = '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const LOCK = '<svg width="13" height="13" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>';


  function render(d, picture) {
    const total = d.fu + d.hui;
    const { idx, cur, next } = lotusLevel(total);
    const pct = next ? Math.round((total - cur.at) / (next.at - cur.at) * 100) : 100;
    const typeChip = t => `<span class="chip ${t === '修慧' ? 'hui' : ''}">${esc(t)}</span>`;

    const events = (d.events || []).length
      ? d.events.map(e => `
        <div class="item">
          <div class="icon-box">${esc(e.icon || '・')}</div>
          <div class="mid">
            <div class="title"><b>${esc(e.name)}</b>${e.type ? typeChip(e.type) : ''}</div>
            <div class="sub">${esc(e.days)}${e.time ? `　${esc(e.time)}` : ''}</div>
          </div>
        </div>`).join('')
      : `<div class="empty">本月活動整理中，敬請期待 🙏</div>`;

    const levels = LOTUS_LEVELS.map((l, i) => `
      <div class="item lv ${i === idx ? 'now' : ''} ${i > idx ? 'locked' : ''}">
        <div class="icon-box">${l.icon}</div>
        <div class="mid">
          <div class="title"><b>${l.name}</b>${i === idx ? '<span class="badge">目前等級</span>' : ''}</div>
          <div class="sub">${l.desc}<br>需要 ${l.at} 點</div>
        </div>
        <div class="state ${i <= idx ? 'ok' : 'lock'}">${i <= idx ? CHECK : LOCK}</div>
      </div>`).join('');

    const recent = d.recent.length
      ? d.recent.map(r => `
        <div class="item">
          <span class="chip ${r.type === '修慧' ? 'hui' : ''}">${r.type === '修慧' ? '存慧' : '存福'}</span>
          <div class="mid"><b style="font-weight:500">${esc(r.spot)}</b><div class="sub" style="margin:0">${esc(r.date.replace(/-/g, '/'))}</div></div>
          <div class="dur">${esc(r.time || '')}</div>
        </div>`).join('')
      : `<div class="empty">存摺還是新的<br>下次來寺裡，記得碰一下貼紙 🙏</div>`;

    app.innerHTML = `
      <div class="me">
        <div class="avatar">${picture ? `<img src="${esc(picture)}" alt="">` : cur.icon}</div>
        <div>
          <b>${esc(d.name)}</b>
          <span class="chip">${cur.name}</span>
        </div>
      </div>

      <div class="level">
        <div class="head">
          <div class="lotus">${cur.icon}</div>
          <div>
            <small>目前蓮花等級</small>
            <h2>${cur.name}</h2>
            <div class="desc">${cur.desc}</div>
          </div>
        </div>
        <div class="progress">
          <div class="row"><span>${cur.name}</span><span>${next ? `${next.name}（${next.at} 點）` : '圓滿'}</span></div>
          <div class="bar"><i></i></div>
          <div class="foot"><span>累積 ${total} 點</span><span>${next ? `還差 ${next.at - total} 點升級` : '金蓮常開'}</span></div>
        </div>
        <div class="stats">
          <div><b>${total}</b><span>總點數</span></div>
          <div><b>${d.fu}</b><span>存福點數</span></div>
          <div><b>${d.hui}</b><span>存慧點數</span></div>
        </div>
      </div>

      <div class="section">
        <h3>本月重點活動</h3>
        <div class="list">${events}</div>
      </div>

      <div class="section">
        <h3>蓮花等級</h3>
        <div class="list">${levels}</div>
      </div>

      <div class="section">
        <h3>最近的足跡</h3>
        <div class="list">${recent}</div>
      </div>

      ${d.isAdmin ? `<a href="/checkin/admin" style="display:block;margin-top:22px;text-align:center;padding:14px;border-radius:14px;background:var(--green);color:#fff;text-decoration:none;letter-spacing:0.15em;font-size:15px">負責人：查看全部義工</a>` : ''}
      <div class="foot-note">修福、修慧分開算・各自一天最多 2 點（隔 4 小時）</div>`;

    requestAnimationFrame(() => requestAnimationFrame(() => {
      app.querySelector('.bar i').style.width = Math.max(pct, total ? 4 : 0) + '%';
    }));
  }

  function message(title, body) {
    app.innerHTML = `<div class="center"><b style="color:var(--ink);font-size:18px">${title}</b><br>${body}</div>`;
  }

  (async function start() {
    try {
      await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
    } catch (err) {
      return message('暫時無法開啟', '請確認手機有連上網路，再試一次 🙏');
    }
    if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href });

    let data;
    try {
      const res = await fetch('/checkin/passbook/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken: liff.getIDToken() }),
      });
      data = await res.json();
    } catch (err) {
      return message('網路好像不太順', '請稍等一下再打開 🙏');
    }

    if (data.error === 'relogin' && !sessionStorage.getItem('relogged')) {
      sessionStorage.setItem('relogged', '1');
      liff.logout();
      return liff.login({ redirectUri: location.href });
    }
    sessionStorage.removeItem('relogged');

    if (!data.ok) return message('存摺暫時打不開', '請稍後再試，或告訴知客處的師父 🙏');
    if (data.status === 'notRegistered') {
      return message('還沒有您的存摺', '下次來寺裡，用手機碰一下打卡貼紙<br>就會幫您開好存摺 🙏');
    }
    let picture = '';
    try { picture = (liff.getDecodedIDToken() || {}).picture || ''; } catch (err) {}
    render(data, picture);
  })();
</script>
</body>
</html>
