<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>釋傳徹 — 明善寺</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #f0f2f5;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei",
                   "Helvetica Neue", Arial, sans-serif;
      padding: 0 0 40px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 0 0 28px 28px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.13);
    }

    /* ── Header banner ── */
    .header {
      position: relative;
      height: 180px;
      background: linear-gradient(135deg, #6b2fa0 0%, #9c4dcc 45%, #c67edb 100%);
      overflow: hidden;
    }

    /* Decorative bokeh circles */
    .header::before {
      content: "";
      position: absolute;
      width: 260px; height: 260px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      top: -80px; right: -60px;
    }
    .header::after {
      content: "";
      position: absolute;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      bottom: -50px; left: 20px;
    }

    /* Lotus watermark SVG in header */
    .header-lotus {
      position: absolute;
      bottom: -10px; right: 16px;
      width: 110px; height: 110px;
      opacity: 0.12;
    }

    /* ── Avatar ring ── */
    .avatar-wrap {
      position: absolute;
      bottom: -46px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .avatar-ring {
      width: 92px; height: 92px;
      border-radius: 50%;
      background: linear-gradient(135deg, #9c4dcc, #6b2fa0);
      padding: 3px;
      box-shadow: 0 4px 20px rgba(107,47,160,0.45);
    }
    .avatar-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: linear-gradient(160deg, #ede0f7 0%, #d8b4f8 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
      line-height: 1;
    }

    /* ── Body ── */
    .body {
      padding: 58px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .name {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #1a0033;
      margin-bottom: 8px;
    }

    .org-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #6b2fa0, #9c4dcc);
      color: #fff;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    /* Role chips */
    .roles {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 26px;
    }
    .role-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      background: #f5eeff;
      border: 1px solid #d8b4f8;
      border-radius: 30px;
      font-size: 0.85rem;
      color: #5b1f8f;
      font-weight: 500;
      line-height: 1.3;
      text-align: center;
    }
    .chip-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #9c4dcc;
      flex-shrink: 0;
    }

    /* ── Divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d8b4f8, transparent);
      margin-bottom: 20px;
    }

    /* ── Action buttons ── */
    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
      padding: 0 4px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      font-family: inherit;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.13);
      filter: brightness(1.04);
    }
    .btn:active { transform: scale(0.98); }

    .btn-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .btn-text { flex: 1; }
    .btn-label {
      font-size: 0.72rem;
      opacity: 0.7;
      display: block;
      margin-bottom: 2px;
      letter-spacing: 0.05em;
    }
    .btn-value {
      font-size: 0.97rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .btn-arrow {
      font-size: 0.85rem;
      opacity: 0.4;
    }

    /* Individual button colors */
    .btn-phone   { background: #e8f5e9; }
    .btn-phone   .btn-icon { background: #a5d6a7; }
    .btn-phone   .btn-value { color: #1b5e20; }

    .btn-mobile  { background: #e3f2fd; }
    .btn-mobile  .btn-icon { background: #90caf9; }
    .btn-mobile  .btn-value { color: #0d47a1; }

    .btn-email   { background: #fff8e1; }
    .btn-email   .btn-icon { background: #ffe082; }
    .btn-email   .btn-value { color: #e65100; }

    .btn-map     { background: #fce4ec; }
    .btn-map     .btn-icon { background: #f48fb1; }
    .btn-map     .btn-value { color: #880e4f; }

    .btn-fb      { background: #e8eaf6; }
    .btn-fb      .btn-icon { background: #9fa8da; }
    .btn-fb      .btn-value { color: #1a237e; }

    .btn-ig      { background: #fff0f6; }
    .btn-ig      .btn-icon { background: linear-gradient(135deg, #f9ce34 0%, #ee2a7b 50%, #6228d7 100%); }
    .btn-ig      .btn-value { color: #6228d7; }

    .btn-threads { background: #f3f3f3; }
    .btn-threads .btn-icon { background: #000; }
    .btn-threads .btn-value { color: #111; }

    .btn-tiktok  { background: #e8fafa; }
    .btn-tiktok  .btn-icon { background: #010101; }
    .btn-tiktok  .btn-value { color: #010101; }

    /* ── Footer ── */
    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.7rem;
      color: #9c4dcc;
      opacity: 0.6;
      letter-spacing: 0.18em;
    }

    @media (max-width: 360px) {
      .name { font-size: 1.5rem; }
      .btn-value { font-size: 0.88rem; }
    }
  </style>
